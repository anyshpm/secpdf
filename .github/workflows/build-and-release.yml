name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  APP_NAME: secpdf
  PYTHON_VERSION: '3.12'

jobs:
  build_wheels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  build_executables:
    name: Build (${{ matrix.platform }}-${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,     platform: windows, arch: x64,   target: amd64 }
          - { os: windows-2022,     platform: windows, arch: x86,   target: i386 }
          - { os: ubuntu-24.04,     platform: linux,   arch: x64,   target: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux,   arch: arm64, target: arm64 }
          - { os: macos-15-intel,   platform: darwin,  arch: x64,   target: amd64 }
          - { os: macos-15,         platform: darwin,  arch: arm64, target: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Install file (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: choco install -y file

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name ${{ env.APP_NAME }} --console secpdf_cli.py
          pyinstaller --onefile --name ${{ env.APP_NAME }}-gui --windowed secpdf_gui.py

      - name: Smoke Test (CLI)
        shell: bash
        run: |
          EXT=$([[ "${{ matrix.platform }}" == "windows" ]] && echo ".exe" || echo "")
          ./dist/${{ env.APP_NAME }}${EXT} --help >/dev/null
          ./dist/${{ env.APP_NAME }}${EXT} --version >/dev/null

      - name: Package and Verify
        shell: bash
        run: |
          set -e
          VERSION_NUMBER="${GITHUB_REF_NAME#v}"
          mkdir -p packages
          EXT=$([[ "${{ matrix.platform }}" == "windows" ]] && echo ".exe" || echo "")

          cp dist/${{ env.APP_NAME }}${EXT} \
             packages/${{ env.APP_NAME }}_${VERSION_NUMBER}_${{ matrix.platform }}_${{ matrix.target }}${EXT}
          cp dist/${{ env.APP_NAME }}-gui${EXT} \
             packages/${{ env.APP_NAME }}-gui_${VERSION_NUMBER}_${{ matrix.platform }}_${{ matrix.target }}${EXT}

          EXPECT="${{ matrix.target }}"
          for f in packages/*; do
            INFO=$(file "$f")
            echo "Verifying $f: $INFO"
            case "$EXPECT" in
              amd64) echo "$INFO" | grep -Eiq 'x86-64|x86_64' ;;
              i386)  echo "$INFO" | grep -Eiq '80386|i386' ;;
              arm64) echo "$INFO" | grep -Eiq 'aarch64|arm64' ;;
            esac || exit 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.target }}
          path: packages/*

  release:
    needs: [build_wheels, build_executables]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      TAG_NAME: ${{ github.ref_name }}
      VERSION_NUMBER: ${{ github.ref_name }}
      IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Show release info
        run: |
          echo "Tag:        $TAG_NAME"
          echo "Version:    ${TAG_NAME#v}"
          echo "Prerelease: $IS_PRERELEASE"

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          name: secpdf ${{ github.ref_name }}
          prerelease: ${{ env.IS_PRERELEASE }}