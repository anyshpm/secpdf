name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  APP_NAME: secpdf
  PYTHON_VERSION: '3.12'

jobs:
  build_wheels:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  build_executables:
    name: Build (${{ matrix.platform }}-${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022,   platform: windows, arch: x64,   target: amd64 }
          - { os: windows-2022,   platform: windows, arch: x86,   target: i386 }
          - { os: ubuntu-24.04,   platform: linux,   arch: x64,   target: amd64 }
          - { os: macos-15-intel, platform: darwin,  arch: x64,   target: amd64 }
          - { os: macos-15,       platform: darwin,  arch: arm64, target: arm64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Install file (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: choco install -y file

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name ${{ env.APP_NAME }} --console secpdf/core.py
          pyinstaller --onefile --name ${{ env.APP_NAME }}-gui --windowed secpdf_gui.py

      - name: Smoke Test (CLI)
        shell: bash
        run: |
          EXT=$([[ "${{ matrix.platform }}" == "windows" ]] && echo ".exe" || echo "")
          ./dist/${{ env.APP_NAME }}${EXT} --help >/dev/null
          ./dist/${{ env.APP_NAME }}${EXT} --version >/dev/null

      - name: Package and Verify
        shell: bash
        run: |
          set -e
          VERSION_NUMBER="${GITHUB_REF_NAME#v}"
          mkdir -p packages
          EXT=$([[ "${{ matrix.platform }}" == "windows" ]] && echo ".exe" || echo "")

          cp dist/${{ env.APP_NAME }}${EXT} \
             packages/${{ env.APP_NAME }}_${VERSION_NUMBER}_${{ matrix.platform }}_${{ matrix.target }}${EXT}
          cp dist/${{ env.APP_NAME }}-gui${EXT} \
             packages/${{ env.APP_NAME }}-gui_${VERSION_NUMBER}_${{ matrix.platform }}_${{ matrix.target }}${EXT}

          EXPECT="${{ matrix.target }}"
          for f in packages/*; do
            INFO=$(file "$f")
            echo "Verifying $f: $INFO"
            case "$EXPECT" in
              amd64) echo "$INFO" | grep -Eiq 'x86-64|x86_64' ;;
              i386)  echo "$INFO" | grep -Eiq '80386|i386' ;;
              arm64) echo "$INFO" | grep -Eiq 'aarch64|arm64' ;;
            esac || exit 1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.target }}
          path: packages/*

  build_arm_executables:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { arch: aarch64, target: arm64, platform_tag: linux/arm64 }
          - { arch: armv7,   target: armv7, platform_tag: linux/arm/v7 }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3

      - name: Build and Smoke Test in Docker
        run: |
          VERSION_NUMBER="${GITHUB_REF_NAME#v}"
          docker run --rm \
            --platform ${{ matrix.platform_tag }} \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            python:${{ env.PYTHON_VERSION }}-slim \
            bash -c "
              set -e
              apt-get update
              apt-get install -y file gcc g++ make zlib1g-dev libjpeg-dev libpng-dev

              pip install --no-cache-dir pyinstaller -r requirements.txt

              pyinstaller --onefile --name secpdf secpdf/core.py
              pyinstaller --onefile --name secpdf-gui secpdf_gui.py

              ./dist/secpdf --help >/dev/null
              ./dist/secpdf --version >/dev/null

              mkdir -p packages
              cp dist/secpdf packages/secpdf_${VERSION_NUMBER}_linux_${{ matrix.target }}
              cp dist/secpdf-gui packages/secpdf-gui_${VERSION_NUMBER}_linux_${{ matrix.target }}

              for f in packages/*; do
                INFO=\$(file \"\$f\")
                echo \"\$INFO\"
                [[ '${{ matrix.target }}' == 'arm64' ]] && echo \"\$INFO\" | grep -Ei 'aarch64|arm64'
                [[ '${{ matrix.target }}' == 'armv7' ]] && echo \"\$INFO\" | grep -Ei 'ARM.*EABI'
              done
            "

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.target }}
          path: packages/*

  release:
    needs: [build_wheels, build_executables, build_arm_executables]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          name: secpdf ${{ github.ref_name }}
