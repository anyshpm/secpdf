name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  VERSION: ${{ github.ref_name }}

jobs:
# -------------------------------------------------
# 1. Build Python wheels
# -------------------------------------------------
  build_wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

# -------------------------------------------------
# 2. Native executables (x64)
# -------------------------------------------------
  build_executables:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64

          - os: ubuntu-latest
            name: linux-x64

          - os: macos-latest
            name: macos-universal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build CLI
        run: |
          pyinstaller --onefile \
            --name secpdf-${{ env.VERSION }}-${{ matrix.name }} \
            secpdf.py

      - name: Build GUI
        run: |
          pyinstaller --onefile --windowed \
            --name secpdf-gui-${{ env.VERSION }}-${{ matrix.name }} \
            secpdf_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.name }}
          path: dist/*

# -------------------------------------------------
# 3. ARM executables (Docker + QEMU)
# -------------------------------------------------
  build_executables_arm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            platform: linux/arm64

          - name: linux-armv7
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM image
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t secpdf-arm-builder \
            -f .github/docker/Dockerfile.arm \
            --load .

      - name: Build ARM binaries
        run: |
          docker run --rm \
            -e VERSION=${{ env.VERSION }} \
            -v ${{ github.workspace }}/dist:/app/dist \
            secpdf-arm-builder \
            bash -c "
              pyinstaller --onefile \
                --name secpdf-${VERSION}-${{ matrix.name }} \
                secpdf.py && \
              pyinstaller --onefile --windowed \
                --name secpdf-gui-${VERSION}-${{ matrix.name }} \
                secpdf_gui.py
            "

      - uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.name }}
          path: dist/*

# -------------------------------------------------
# 4. Release
# -------------------------------------------------
  release:
    needs:
      - build_wheels
      - build_executables
      - build_executables_arm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            artifacts/wheels/*.whl
            artifacts/executables-*/secpdf*
          generateReleaseNotes: true
          body: |
            ## 下载说明

            ### 文件命名规则
            `secpdf-{VERSION}-{OS}-{ARCH}`

            ### CLI / GUI
            - CLI：`secpdf-*`
            - GUI：`secpdf-gui-*`

            ### Linux ARM
            - `linux-arm64`：树莓派 4 / 5
            - `linux-armv7`：树莓派 2 / 3
